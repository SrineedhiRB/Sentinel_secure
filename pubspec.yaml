name: sentinel_offline_biometric
description: A production-grade secure offline facial recognition and liveness detection system.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+5
  google_mlkit_face_detection: ^0.9.0
  tflite_flutter: ^0.10.0
  sqflite_sqlcipher: ^3.0.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.1
  path: ^1.8.3
  intl: ^0.18.1
  crypto: ^3.0.3
  google_fonts: ^6.1.0
  provider: ^6.0.5
  permission_handler: ^11.0.1
  logger: ^2.0.2
  device_info_plus: ^9.0.2
  qr_flutter: ^4.0.0
  confetti: ^0.7.0
  csv: ^5.0.0
  image: ^4.1.3
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
